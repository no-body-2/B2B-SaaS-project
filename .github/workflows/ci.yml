# Workflow Name
name: LumiNano CI/CD

# Event Trigger
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Jobs
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @luminano/database db:generate

      - name: Run Linter
        run: pnpm run lint
      
      - name: Run Type Check
        run: pnpm run check-types

      - name: Build Application
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm --filter api test

  deploy-api:
    needs: build-and-test
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/luminano-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy-web:
    needs: build-and-test
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_MOCK=false
            NEXT_PUBLIC_API_URL=https://api.luminano.xyz
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/luminano-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  restart-k3s:
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH to EC2 & Restart Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export KUBECONFIG=$HOME/.kube/config
            kubectl rollout restart deployment/luminano-api
            kubectl rollout restart deployment/luminano-web
            kubectl rollout status deployment/luminano-api --timeout=180s
            kubectl rollout status deployment/luminano-web --timeout=180s